<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sotel - Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/sotel-favicon.svg" type="image/svg+xml">
    <!-- Remote logo (use to download real logo): https://fr.wikipedia.org/wiki/Sotel_Tchad -->
</head>

<body>

    <header>
        <div class="container header-top">
            <div class="brand">
                <img src="assets/images/logo.png" alt="Sotel logo">
                <a href="Sotel.html" class="logo">Sotel Tchad</a>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search products, services, news...">
            </div>

            <div class="header-actions">
                <a class="pill-btn primary" href="#">💬 Live Chat</a>
                <a class="pill-btn" href="#">⭐ Our Agencies</a>
                <div class="lang-toggle">
                    <button class="lang-btn active" type="button">EN</button>
                    <button class="lang-btn" type="button">FR</button>
                </div>
                <div class="hamburger" id="hamburger">☰</div>
            </div>
        </div>

        <div class="container header-nav">
            <ul class="nav-links" id="nav-links">
                <li><a href="Sotel.html">Home</a></li>
                <li><a href="mobile.html">Mobile</a></li>
                <li><a href="internet.html">Internet</a></li>
                <li><a href="clearchannel.html">Clear channel</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>We are here to help you 24/7.</p>
        </div>
    </div>

    <section class="container">
        <div class="contact-container">
            <div class="contact-info">
                <h3 style="color: var(--cam-blue); margin-bottom: 20px;">Get in Touch</h3>
                <p><strong>Headquarters:</strong><br>123 Sotel Avenue, Douala, Cameroon</p>
                <br>
                <p><strong>Phone:</strong><br>+237 600 000 000</p>
                <br>
                <p><strong>Email:</strong><br>support@sotel.cm</p>
            </div>

            <div class="contact-form">
                <form id="contactForm" novalidate>
                    <div class="form-group">
                        <label>Name</label>
                        <input name="name" type="text" placeholder="Your Full Name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input name="email" type="email" placeholder="Your Email Address" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message" rows="5" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                    <div id="contactFeedback" style="margin-top:10px;font-weight:bold;"></div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container copyright">
            &copy; 2023 Sotel Communications.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
